[project]
name = "raceiq"
version = "0.1.0"
description = "RaceIQ — F1 race strategy intelligence platform"
requires-python = ">=3.10"
dependencies = [
    "catboost>=1.2.10",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "fastf1>=3.8.3",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# This project isn't installed as a package (package = false above), and
# every script here is already run as `uv run python -m <pkg>.<mod>` from
# the repo root, which relies on the CWD being on sys.path. pytest needs
# the same thing spelled out explicitly.
pythonpath = ["."]
testpaths = ["tests"]
